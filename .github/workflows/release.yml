name: release

on:
  push:
    branches: [main]
    tags: ["DS-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      # The app version is the VERSION file. A `DS-*` tag names the baseline
      # Driver Station release this build is compatible with, and moves
      # independently.
      - id: v
        run: |
          set -euo pipefail
          app="$(tr -d '[:space:]' < VERSION)"
          [ -n "$app" ] || { echo "VERSION is empty" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${app}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${app}-main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY is not set" >&2; exit 1; }
          printf '%s' "$SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out dist/SHA256SUMS.sig dist/SHA256SUMS
          rm -f key.pem
      - name: Reset the rolling release
        if: needs.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" --silent || true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: >-
            ${{ needs.version.outputs.prerelease == 'true'
                && format('Latest main ({0})', needs.version.outputs.version)
                || format('{0} ({1})', needs.version.outputs.version,
                          needs.version.outputs.tag) }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          # The rolling "latest" release is re-pointed at each main build.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Built from ${{ needs.version.outputs.version }}.

            **Linux / Windows**: unpack a bundle into an empty directory and run
            the `deck-station` launcher at its root; it hands off to the build
            under `bin/`. Once installed, update from
            **Settings ▸ Check for Updates** instead of downloading again.

            **Windows**: the build is unsigned, so extra steps may be required
            to let Windows run it the first time.

            **macOS**: open the `.dmg` and drag `deck-station` to Applications.
            The build is ad-hoc signed rather than notarized, so Gatekeeper
            blocks the first launch. Expect to grant that exception yourself, by
            whatever route your macOS version provides. The macOS build cannot
            update in-app, so download a newer `.dmg` from this page.

            `SHA256SUMS` covers every file above.

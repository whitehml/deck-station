name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: gdformat (check)
        run: gdformat --check --line-length 100 godot/
      - name: gdlint
        run: gdlint godot/

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # external/robocol
      - name: Install pinned Rust (from rust-toolchain.toml)
        working-directory: rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build bridge
        working-directory: rust
        run: cargo build --release -p robocol_godot

  export-smoke:
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install pinned Rust (from rust-toolchain.toml)
        working-directory: rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build bridge (release)
        working-directory: rust
        run: cargo build --release -p robocol_godot
      - name: Build fake_rc (for mock)
        working-directory: external/robocol
        run: cargo build -p fake_rc
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import project
        run: godot --headless --path godot --import
      - name: Headless export
        run: godot --headless --path godot --export-release "Linux"
